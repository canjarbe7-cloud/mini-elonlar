services:
  - type: web
    name: elonlar-web
    env: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn config.wsgi --log-file -
    envVars:
      - key: DEBUG
        value: "False"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
# Set these values in Render dashboard secrets before deploy:
#   SECRET_KEY
#   ALLOWED_HOSTS
#   DATABASE_URL
#   EMAIL_BACKEND
#   EMAIL_HOST
#   EMAIL_PORT
#   EMAIL_HOST_USER
#   EMAIL_HOST_PASSWORD
#   DEFAULT_FROM_EMAIL
#   GOOGLE_CLIENT_ID
#   GOOGLE_CLIENT_SECRET
#   TELEGRAM_BOT_TOKEN
#   TELEGRAM_BOT_USERNAME
