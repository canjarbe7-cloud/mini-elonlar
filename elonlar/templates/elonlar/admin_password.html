{% extends "elonlar/base.html" %}

{% block title %}Admin parol - Elon{% endblock %}

{% block content %}
<section class="auth-shell">
    <div class="form-heading">
        <p class="eyebrow">Admin</p>
        <h1>Admin parolini yangilash</h1>
    </div>

    <form class="password-form" method="post" novalidate>
        {% csrf_token %}

        {% if form.non_field_errors %}
            <div class="form-errors">{{ form.non_field_errors }}</div>
        {% endif %}

        {% for field in form %}
            <label>
                {{ field.label }}
                {{ field }}
                {% for error in field.errors %}
                    <span class="error">{{ error }}</span>
                {% endfor %}
            </label>
        {% endfor %}

        <button class="button button-dark full" type="submit">Parolni yangilash</button>
    </form>
</section>
{% endblock %}
